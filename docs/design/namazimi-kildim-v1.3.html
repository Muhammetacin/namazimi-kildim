<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}html,body{margin:0;background:#EDE5D8}body{padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}</style>
<title>Namazımı Kıldım! — Prototip 1.3</title>
</head>
<body>
<div id="nk"></div>
<style>
#nk{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#40362B;font-size:14px;line-height:1.5}
#nk *{box-sizing:border-box}
#nk .phone{max-width:430px;margin:auto;background:#F5EEE3;border:1px solid #DED2C0;border-radius:24px;overflow:hidden;min-height:680px;display:flex;flex-direction:column}
#nk .body{padding:24px;flex:1;display:flex;flex-direction:column;gap:20px}
#nk h1{font-size:25px;line-height:1.25;font-weight:600;margin:0;letter-spacing:-.7px}
#nk h2{font-size:19px;font-weight:600;margin:0}
#nk p{margin:0}
#nk .muted{color:#82735E;font-size:12px}
#nk .green{color:#086347}
#nk .center{text-align:center}
#nk .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#nk .stack{display:flex;flex-direction:column;gap:5px}
#nk .grow{flex:1}
#nk button,#nk select,#nk input{font:inherit}
#nk button{cursor:pointer;border:0;color:inherit;background:transparent;padding:9px;border-radius:7px}
#nk button:disabled{opacity:.4;cursor:default}
#nk .primary{background:#086347;color:white;font-size:17px;font-weight:600;width:100%;padding:15px;border-radius:9px}
#nk .line{border-bottom:1px solid #DED2C0}
#nk .item{padding:12px 0;border-bottom:1px solid #E5DACA;display:flex;align-items:center;gap:12px}
#nk .square{width:27px;height:27px;background:#E5DACA;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:white;padding:0;flex-shrink:0}
#nk .square.yes{background:#086347}
#nk .five{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;text-align:center}
#nk .five button{display:flex;align-items:center;flex-direction:column;gap:8px;font-size:11px;padding:6px 0}
#nk .nav{border-top:1px solid #DED2C0;display:flex;justify-content:space-around;padding:9px 10px 14px}
#nk .nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#82735E;min-width:65px}
#nk .nav button.active{color:#086347}
#nk .nav svg{width:23px;height:23px}
#nk .segment{display:flex;background:#E8DFD2;border-radius:8px;padding:3px;gap:3px}
#nk .segment button{flex:1}
#nk .segment .active{background:#F5EEE3;color:#086347;font-weight:600}
#nk .heat{display:grid;gap:4px}
#nk .heat button{padding:0;aspect-ratio:1;border-radius:3px;min-width:0}
#nk .heat button.selected{outline:2px solid #086347;outline-offset:1px}
#nk .toggle{width:41px;height:24px;border-radius:15px;background:#D6C9B6;padding:3px;display:flex;align-items:center;flex-shrink:0}
#nk .toggle.on{background:#086347;justify-content:flex-end}
#nk .toggle span{display:block;width:18px;height:18px;border-radius:50%;background:white}
#nk select,#nk input[type=text]{background:transparent;border:1px solid #D8CBB8;color:#40362B;border-radius:10px;padding:10px 12px;max-width:100%}
#nk select{font-size:12px}
#nk input[type=range]{width:100%;accent-color:#086347}
#nk .heading{font-size:10px;color:#82735E;letter-spacing:1.2px;font-weight:600}
#nk .soft{background:#E2E9DA;padding:12px;border-radius:8px}
#nk .legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10px;color:#82735E}
#nk .legend span{width:14px;height:14px;border-radius:3px}
#nk .demo{max-width:430px;margin:10px auto 0;padding:12px 16px;border:1px solid #D8CBB8;border-radius:12px;font-size:12px}
#nk .link{color:#086347;font-weight:500}
#nk svg{display:block;margin:auto;max-width:100%}

/* FIXES */
#nk button.bare{padding:0;border-radius:14px;text-align:left}
#nk button.line{border-radius:0;padding:12px 0;text-align:left;width:100%}
#nk .heading{margin:10px 0 -8px}
#nk .item select{width:150px;flex-shrink:0;text-overflow:ellipsis}
#nk .navArrow{font-size:24px;line-height:1;padding:6px 14px}
#nk .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px;color:#82735E;margin-bottom:-14px}
#nk .heat .pad{display:block;aspect-ratio:1}
#nk .heat button.today{outline:2px solid #40362B;outline-offset:1px}
@media (pointer:coarse){#nk select,#nk input[type=text]{font-size:16px}}
/* NEW */
#nk .stepper{display:flex;align-items:center;justify-content:center;gap:8px}
#nk .step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
#nk .stepCircle{width:32px;height:32px;border-radius:50%;border:1.5px solid #B9AB96;display:flex;align-items:center;justify-content:center;font-weight:600;color:#82735E;background:#F5EEE3}
#nk .step.active .stepCircle{background:#086347;color:#fff;border-color:#086347}
#nk .step.done .stepCircle{background:#BFD1B5;color:#086347;border-color:#BFD1B5}
#nk .stepLabel{font-size:11px;color:#82735E}
#nk .step.active .stepLabel{color:#086347;font-weight:600}
#nk .stepLine{height:1px;background:#CDBEAA;flex:0 0 40px;margin-bottom:22px}

#nk .langList{display:flex;flex-direction:column;gap:10px}
#nk .langBtn{display:flex;align-items:center;justify-content:space-between;border:1px solid #DED2C0;border-radius:12px;padding:12px 14px;background:#FBF7F0}
#nk .langBtn.active{border-color:#086347;background:#EEF4E8}
#nk .langLeft{display:flex;align-items:center;gap:10px}
#nk .flag{font-size:19px;line-height:1}

#nk .citySearchWrap{position:relative}
#nk .citySearchWrap input{padding-left:40px;width:100%}
#nk .citySearchIcon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#82735E}

#nk .cityCards{display:flex;flex-direction:column;gap:10px}
#nk .cityCard{display:flex;align-items:center;gap:12px;border:1px solid #DED2C0;border-radius:14px;padding:13px 14px;background:#FBF7F0}
#nk .cityCard.active{border-color:#86A76F;background:#EEF4E8}
#nk .cityCard .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #B9AB96;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#nk .cityCard.active .radio{border-color:#086347}
#nk .cityCard .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:#086347;opacity:0}
#nk .cityCard.active .radio::after{opacity:1}
#nk .cityCardTitle{font-weight:600}
#nk .cityCardSub{font-size:12px;color:#82735E}

#nk .autoCard{display:flex;align-items:center;gap:12px;border:1px solid #D8CBB8;border-radius:14px;padding:13px 14px;background:#EEF4E8}
#nk .autoCard .arrow{margin-left:auto;color:#82735E}

#nk .timesList{display:flex;flex-direction:column;gap:10px}
#nk .timeRow{display:grid;grid-template-columns:28px 1fr auto 27px;align-items:center;gap:12px;border:1px solid #E5DACA;border-radius:12px;padding:14px;background:#FBF7F0;min-height:64px}
#nk .timeRow[data-act],#nk .item[data-act]{cursor:pointer}
#nk .timeRow.active{background:#EEF4E8;border-color:#D5E3CB}
#nk .timeRowLabel{font-weight:600}
#nk .timeRowMeta{font-size:11px;color:#086347;min-height:14px}
#nk .timeRowMeta.empty{color:transparent}
</style>

<script>
(()=>{
const root=document.getElementById('nk');
const P=['Sabah','Öğle','İkindi','Akşam','Yatsı'];
const LANGS=[
  ['Türkçe','🇹🇷'],
  ['English','🇬🇧'],
  ['Nederlands','🇧🇪'],
  ['Français','🇫🇷'],
  ['Deutsch','🇩🇪'],
  ['العربية','🇸🇦']
];
const C=['#E5DACA','#D0DEC8','#A7C6A3','#78AC83','#39875D','#086347'];
const times=[392,500,754,905,1009,1106];
const base=new Date(2026,10,27,12);
const S={page:'welcome',city:'Evergem, Belçika',auto:false,query:'',lang:'Türkçe',method:'Diyanet',school:'Hanefi',format:'24',notify:true,alerts:[true,true,true,true,true],timing:'0',sound:'Hafif ses',reminder:false,minute:804,period:'Ay',day:0,detail:-7,records:{0:[true,false,false,false,false]},from:'welcome'};

const icons={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',pin:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',bell:'<path d="M5 17h14l-2-4V8a5 5 0 0 0-10 0v5ZM10 20h4"/>',back:'<path d="m15 5-7 7 7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',moon:'<path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'};
const ico=(n,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${icons[n]||icons.sun}</svg>`;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(o){let d=new Date(base);d.setDate(d.getDate()+o);return d}
function label(o){return date(o).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}
function record(o){if(!S.records[o]){let k=o<0&&o>=-330?Math.abs(o*17+Math.floor(o/7)*3)%6:0;S.records[o]=P.map((_,i)=>i<k)}return S.records[o]}
function count(o){return record(o).filter(Boolean).length}
function fmt(m){let h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');if(S.format==='12'){let s=h>=12?'PM':'AM';h=h%12||12;return h+':'+mm+' '+s}return String(h).padStart(2,'0')+':'+mm}
function current(){let m=S.minute;if(m<392)return [4,392-m];if(m<500)return [0,500-m];if(m<754)return [-1,754-m];if(m<905)return [1,905-m];if(m<1009)return [2,1009-m];if(m<1106)return [3,1106-m];return [4,1832-m]}
function btn(t,a,cls='',disabled=false){return `<button class="${cls}" data-act="${a}" ${disabled?'disabled':''}>${t}</button>`}
function nav(){return `<div class="nav">${[['home','clock','Saat'],['times','calendar','Vakitler'],['track','grid','Takip']].map(([p,i,n])=>btn(ico(i)+n,'page:'+p,(S.page===p||(p==='track'&&S.page==='detail'))?'active':'')).join('')}</div>`}
function header(t,back='home'){return `<div class="row">${btn(ico('back'),'page:'+back)}<b>${t}</b><span style="width:40px"></span></div>`}
function five(o){return `<div class="five">${P.map((p,i)=>btn(`<span class="square ${record(o)[i]?'yes':''}">${record(o)[i]?'✓':''}</span><span>${p}</span>`,'mark:'+o+':'+i,'',o>0)).join('')}</div>`}
function toggle(k){return btn('<span></span>','toggle:'+k,'toggle '+(S[k]?'on':''))}
function select(k,options){return `<select data-key="${k}">${options.map(v=>{let a=Array.isArray(v)?v:[v,v];return `<option value="${esc(a[0])}" ${S[k]===a[0]?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`}
function setting(n,k,opts){return `<div class="item"><span class="grow">${n}</span>${select(k,opts)}</div>`}

function stepper(step){
  const items=[
    {n:1,label:'Dil'},
    {n:2,label:'Konum'},
    {n:3,label:'Başla'}
  ];
  return `<div class="stepper">${
    items.map((x,i)=>`
      <div class="step ${x.n<step?'done':x.n===step?'active':''}">
        <div class="stepCircle">${x.n}</div>
        <div class="stepLabel">${x.label}</div>
      </div>
      ${i<items.length-1?'<div class="stepLine"></div>':''}
    `).join('')
  }</div>`;
}

function langList(){
  return `<div class="langList">${
    LANGS.map(([name,flag])=>btn(`
      <div class="langBtn ${S.lang===name?'active':''}">
        <div class="langLeft">
          <span class="flag">${flag}</span>
          <span>${esc(name)}</span>
        </div>
        <span>${S.lang===name?'✓':''}</span>
      </div>
    `,'lang:'+name,'bare')).join('')
  }</div>`;
}

function dial(welcome=false){
  let [active]=current(),m=S.minute, r=110,cx=170,cy=153;
  let point=(t,r)=>[cx+r*Math.sin(t/1440*2*Math.PI),cy-r*Math.cos(t/1440*2*Math.PI)];
  let start=active===4?1106:active===-1?500:times[active===0?0:active+1];
  let end=active===4?1832:active===-1?754:times[active===0?1:active+2]||1106;
  if(active===4&&m<392)m+=1440;
  let arc=(a,b)=>{let p=point(a,r),q=point(b,r);return `M${p.join(' ')} A${r} ${r} 0 ${b-a>720?1:0} 1 ${q.join(' ')}`};
  let dots=times.map((t,i)=>{let p=point(t,r),q=point(t,136);return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#A29177"/><text x="${q[0]}" y="${q[1]+4+(i===0?-9:i===1?9:0)}" font-size="10" text-anchor="middle" fill="#82735E">${['Sabah','Güneş','Öğle','İkindi','Akşam','Yatsı'][i]}</text>`}).join('');
  return `<svg viewBox="0 0 340 310" aria-label="Namaz saati"><circle cx="170" cy="153" r="110" fill="none" stroke="#CDBEAA" stroke-width="1.3"/><circle cx="170" cy="153" r="98" fill="none" stroke="#E5DACA"/>${Array.from({length:60},(_,i)=>{let a=point(i*24,93),b=point(i*24,i%5===0?85:90);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#A29580" stroke-width="${i%5===0?1.3:.6}"/>`}).join('')}${welcome?'<path d="M170 43 A110 110 0 0 1 280 153" stroke="#086347" stroke-width="5" fill="none" stroke-linecap="round"/><path d="m133 153 25 25 49-53" fill="none" stroke="#086347" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>':`<path d="${arc(start,end)}" stroke="#B8CBB4" stroke-width="5" fill="none" stroke-linecap="round"/><path d="${arc(start,m)}" stroke="#086347" stroke-width="5" fill="none" stroke-linecap="round"/>${dots}<circle cx="${point(m,r)[0]}" cy="${point(m,r)[1]}" r="5" fill="#F5EEE3" stroke="#086347" stroke-width="2"/><text x="170" y="129" text-anchor="middle" font-size="11" fill="#82735E">27 KASIM · CUMA</text><text x="170" y="175" text-anchor="middle" font-size="${S.format==='12'?34:46}" fill="#40362B">${fmt(S.minute)}</text>`}</svg>`}

function welcome(){
  return `
    ${stepper(1)}
    <div style="margin-top:10px">${dial(true)}</div>
    <div class="center stack">
      <h1 class="green">Namazımı Kıldım!</h1>
      <b>Vaktini bil, ibadetini takip et.</b>
      <p class="muted">Günün her vaktinde yanında olan sade bir namaz saati.</p>
    </div>
    <div class="stack">
      <b>Dil seçimi</b>
      ${langList()}
    </div>
    <div class="grow"></div>
    ${btn('Devam et →','page:location','primary')}
    <p class="muted center">Üyelik yok. Verilerin sana ait.</p>
  `;
}

function location(){
  let cities=[
    ['Evergem, Belçika','Varsayılan konum'],
    ['Gent, Belçika','Yakındaki şehir'],
    ['Antwerpen, Belçika','Belçika'],
    ['İstanbul, Türkiye','Türkiye']
  ];
  let filtered=cities.filter(c=>c[0].toLocaleLowerCase('tr').includes(S.query.toLocaleLowerCase('tr')));
  return `
    ${S.from==='settings'?header('Konum','settings'):stepper(2)}
    <div class="center" style="margin:10px auto;color:#086347">${ico('pin',75)}</div>
    <div class="center stack">
      <h1>Neredesin?</h1>
      <p class="muted">Namaz vakitlerini bulunduğun konuma göre belirleyelim.</p>
    </div>

    <div class="citySearchWrap">
      <span class="citySearchIcon">${ico('search',18)}</span>
      <input type="text" id="citySearch" placeholder="Şehir veya ülke ara" value="${esc(S.query)}">
    </div>

    ${btn(`
      <div class="autoCard">
        <div style="color:#086347">${ico('pin',20)}</div>
        <div class="stack grow" style="gap:2px;text-align:left">
          <span class="cityCardTitle">Konumumu kullan</span>
          <span class="cityCardSub">GPS ile otomatik belirle</span>
        </div>
        <span class="arrow">›</span>
      </div>
    `,'auto','bare')}

    <div class="cityCards">
      ${filtered.map(([title,sub])=>btn(`
        <div class="cityCard ${S.city===title?'active':''}">
          <div style="color:#82735E">${ico('pin',18)}</div>
          <div class="grow stack" style="gap:2px;text-align:left">
            <span class="cityCardTitle">${esc(title)}</span>
            <span class="cityCardSub">${esc(sub)}</span>
          </div>
          <div class="radio"></div>
        </div>
      `,'city:'+title,'bare')).join('')}
    </div>

    <div class="grow"></div>
    ${btn(S.from==='settings'?'Tamam':'Devam et →','page:'+(S.from==='settings'?'settings':'notifications'),'primary',!S.city)}
    <p class="muted center">Konumun yalnızca namaz vakitleri için kullanılır.</p>
  `;
}

function notifications(){
  return `${S.from==='settings'?header('Bildirimler','settings'):stepper(3)}
  <div style="color:#086347;margin:12px auto">${ico('bell',65)}</div>
  <div class="center stack"><h1>Vaktini hatırlatalım.</h1><p class="muted">Namaz vakti girdiğinde küçük bir hatırlatma.</p></div>
  <div class="row"><b>Namaz bildirimleri</b>${toggle('notify')}</div>
  ${S.notify?`<div class="line"></div><p class="heading">HANGİ VAKİTLER?</p>
  <div class="five">${P.map((p,i)=>btn(`<span>${p}</span><span class="square ${S.alerts[i]?'yes':''}">${S.alerts[i]?'✓':''}</span>`,'alert:'+i)).join('')}</div>
  <p class="heading">BİLDİRİM ZAMANI</p>
  ${[['0','Vakit girdiğinde'],['5','5 dakika önce'],['15','15 dakika önce'],['30','30 dakika önce']].map(([v,n])=>btn(`<div class="row"><span>${n}</span><span class="green">${S.timing===v?'●':'○'}</span></div>`,'timing:'+v,'line')).join('')}
  ${setting('Bildirim sesi','sound',['Hafif ses','Varsayılan','Sessiz'])}
  <div class="row"><div class="stack"><b>Vakit bitmeden hatırlat</b><span class="muted">İşaretlenmediyse 15 dakika önce.</span></div>${toggle('reminder')}</div>`:''}
  <div class="grow"></div>${btn(S.from==='settings'?'Tamam':'Hazırım →','page:'+(S.from==='settings'?'settings':'home'),'primary')}
  ${S.from!=='settings'?btn('Şimdilik atla','skip','muted'):''}`;
}

function home(){
  let [a,left]=current(),done=a>=0&&record(0)[a];
  return `<div class="row"><span class="muted" style="display:flex;gap:5px;align-items:center">${ico('pin',15)} ${esc(S.city.split(',')[0]||'Evergem')}</span>${btn(ico('settings'),'page:settings')}</div>${dial()}
  <div class="center stack"><h1 class="green">${a<0?'Öğle vaktine kadar':P[a]+' Namazı'}</h1><p class="muted">${a<0?'Sıradaki vakte':'Vaktin bitmesine'} ${Math.floor(left/60)} sa ${left%60} dk</p></div>
  <div class="grow"></div>
  <div class="row"><span class="muted">Bugün</span><span class="green">${count(0)}/5</span></div>${five(0)}
  ${btn(a<0?'Henüz namaz vakti değil':done?'✓ Elhamdülillah, kıldım':'✓ Kıldım','current','primary',a<0||done)}`;
}

function timesPage(){
  let [a]=current();
  let rows=[
    ['Sabah',392,0,'sun'],
    ['Güneş',500,-1,'sun'],
    ['Öğle',754,1,'sun'],
    ['İkindi',905,2,'sun'],
    ['Akşam',1009,3,'sun'],
    ['Yatsı',1106,4,'moon']
  ];
  return `
    <div class="row"><span class="muted">${esc(S.city||'Evergem')}</span>${btn(ico('settings'),'page:settings')}</div>
    <h1>Namaz Vakitleri</h1>
    <div class="row">${btn('‹','date:-1','navArrow')}<div class="center"><b>${label(S.day)}</b><p class="muted">${S.day===0?'Bugün':date(S.day).toLocaleDateString('tr-TR',{weekday:'long'})}</p></div>${btn('›','date:1','navArrow')}</div>

    <div class="timesList">
      ${rows.map(([n,t,i,ic])=>{
        const active = S.day===0 && a===i && i>=0;
        return `
          <div class="timeRow ${active?'active':''}" ${i>=0&&S.day<=0?`data-act="mark:${S.day}:${i}"`: ''}>
            <span style="color:#82735E">${ico(ic)}</span>
            <div class="stack" style="gap:2px">
              <span class="timeRowLabel">${n}</span>
              ${active?'<span class="timeRowMeta">Şu anki vakit</span>':''}
            </div>
            <b>${fmt(t)}</b>
            ${i>=0?btn(record(S.day)[i]?'✓':'','mark:'+S.day+':'+i,'square '+(record(S.day)[i]?'yes':''),S.day>0):'<span style="width:27px"></span>'}
          </div>
        `;
      }).join('')}
    </div>

    <div class="grow"></div>
    <p class="muted center">Vakitler örnek amaçlıdır.</p>
  `;
}

function track(){
  let days=[];if(S.period==='Hafta'){days=Array.from({length:7},(_,i)=>-4+i)}else if(S.period==='Ay'){days=Array.from({length:30},(_,i)=>i-26)}else{days=Array.from({length:365},(_,i)=>i-330)}
  let counts=days.filter(o=>o<=0).map(count);
  let total=counts.reduce((a,b)=>a+b,0), completed=counts.filter(n=>n===5).length;
  let periodLabel=S.period==='Hafta'?'Bu hafta':S.period==='Ay'?'Bu ay':'Bu yıl';
  return `<div class="row"><h1>Namaz Takibi</h1>${btn(ico('settings'),'page:settings')}</div><div class="segment">${['Hafta','Ay','Yıl'].map(p=>btn(p,'period:'+p,S.period===p?'active':'')).join('')}</div><div class="row"><b>${S.period==='Yıl'?'2026':S.period==='Ay'?'Kasım 2026':'23–29 Kasım'}</b><span class="muted">${S.period==='Yıl'?'365 gün':''}</span></div>${S.period==='Yıl'?`<div class="yearScroll" style="overflow-x:auto;padding:3px"><div style="min-width:590px"><div class="muted" style="font-size:10px;position:relative;height:14px;margin-bottom:4px">${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'].map((x,mi)=>{let k=days.findIndex(o=>date(o).getMonth()===mi&&date(o).getDate()===1);return k<0?'':`<span style="position:absolute;left:${Math.floor((((date(days[0]).getDay()+6)%7)+k)/7)*11}px">${x}</span>`}).join('')}</div><div class="heat" style="grid-template-rows:repeat(7,9px);grid-auto-flow:column;grid-auto-columns:9px;gap:2px">${Array.from({length:(date(days[0]).getDay()+6)%7},()=>'<span></span>').join('')}${days.map(o=>`<button class="${o===0?'today':''}" style="background:${C[count(o)]}" data-act="detail:${o}" ${o>0?'disabled':''} aria-label="${label(o)}"></button>`).join('')}</div></div></div>`:`<div class="weekdays">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<span>${x}</span>`).join('')}</div><div class="heat" style="grid-template-columns:repeat(7,1fr)">${Array.from({length:(date(days[0]).getDay()+6)%7},()=>'<span class="pad"></span>').join('')}${days.map(o=>`<button class="${o===0?'today':''}" style="background:${C[count(o)]};color:${count(o)>3?'white':'#40362B'}" data-act="detail:${o}" ${o>0?'disabled':''}>${date(o).getDate()}</button>`).join('')}</div>`}<div class="legend">0 ${C.map(c=>`<span style="background:${c}"></span>`).join('')} 5</div><div class="line"></div><div class="row"><div class="stack"><span class="muted">${periodLabel} kılınan</span><h1 class="green">${total}</h1><span class="muted">Namaz</span></div><div class="stack"><span class="muted">${periodLabel} beş vakit tamamlanan</span><h1 class="green">${completed}</h1><span class="muted">Gün</span></div></div><p class="muted center">Detayları görmek için bir güne dokun.</p><div class="grow"></div>`;
}

function detail(){
  let n=count(S.detail);
  return `${header('Gün Detayı','track')}<div class="row">${btn('‹','detailStep:-1','navArrow',S.detail<=-330)}<div class="center"><h2>${label(S.detail)}</h2><p class="muted">${date(S.detail).toLocaleDateString('tr-TR',{weekday:'long'})}</p></div>${btn('›','detailStep:1','navArrow',S.detail===0)}</div><svg viewBox="0 0 180 180" width="155"><circle cx="90" cy="90" r="75" fill="none" stroke="#E5DACA" stroke-width="5"/><circle cx="90" cy="90" r="75" fill="none" stroke="#086347" stroke-width="5" stroke-linecap="round" visibility="${n?'visible':'hidden'}" stroke-dasharray="${n/5*471.24} 471.24" transform="rotate(-90 90 90)"/><text x="90" y="90" text-anchor="middle" font-size="38" fill="#40362B">${n}/5</text><text x="90" y="112" text-anchor="middle" font-size="12" fill="#82735E">Namaz kılındı</text></svg>${five(S.detail)}${P.map((p,i)=>`<div class="item" data-act="mark:${S.detail}:${i}"><span class="grow">${p}</span><span class="muted">${fmt(times[i===0?0:i+1])}</span>${btn(record(S.detail)[i]?'✓':'','mark:'+S.detail+':'+i,'square '+(record(S.detail)[i]?'yes':''))}</div>`).join('')}<p class="muted center">Kutulara dokunarak kayıtlarını düzenleyebilirsin.</p><div class="grow"></div>`;
}

function settings(){
  return `${header('Ayarlar')}<span class="heading">KONUM</span><div class="item"><div class="grow stack">Konum<span class="muted">${esc(S.city)}</span></div>${btn('›','editLocation')}</div><div class="row">Otomatik konum ${toggle('auto')}</div><span class="heading">NAMAZ VAKİTLERİ</span>${setting('Hesaplama yöntemi','method',['Diyanet','Muslim World League','ISNA','Mısır','Karaçi'])}${setting('İkindi hesaplaması','school',['Hanefi','Standart'])}<span class="heading">BİLDİRİMLER</span><div class="row">Namaz hatırlatmaları ${toggle('notify')}</div>${btn('<div class="row"><span>Bildirim tercihleri</span><span>›</span></div>','editNotifications','line')}<span class="heading">GENEL</span>${setting('Uygulama dili','lang',LANGS.map(([n,f])=>[n,`${f} ${n}`]))}${setting('Saat biçimi','format',[['24','24 saat'],['12','12 saat']])}<span class="heading">VERİ VE GİZLİLİK</span><p class="muted">İbadet kayıtları kişiseldir. Üyelik gerekmez.</p><div class="center stack"><b class="green">Namazımı Kıldım!</b><span class="muted">Prototip 1.3</span></div>`;
}

function render(){
  let pages={welcome,location,notifications,home,times:timesPage,track,detail,settings};
  root.innerHTML=`<div class="phone"><div class="body">${pages[S.page]()}</div>${['home','times','track','detail'].includes(S.page)?nav():''}</div><div class="demo"><div class="row"><b>Prototip kontrolleri</b>${btn('Baştan başla','reset','link')}</div><div class="row"><span>Test saati</span><b>${fmt(S.minute)}</b></div><input type="range" min="0" max="1439" step="1" value="${S.minute}" id="testTime"><p class="muted">Saati değiştirerek namaz vakitleri arasındaki geçişi deneyebilirsin.</p></div>`;
  const ys=root.querySelector('.yearScroll');if(ys)ys.scrollLeft=ys.scrollWidth;
}

root.addEventListener('click',e=>{
  let b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  let [a,...v]=b.dataset.act.split(':');
  let n=v.join(':');
  switch(a){
    case'page':S.page=n;if(n==='home')S.from='welcome';break;
    case'auto':S.auto=true;S.city='Evergem, Belçika';break;
    case'city':S.city=n;S.auto=false;break;
    case'toggle':S[n]=!S[n];break;
    case'alert':S.alerts[+n]=!S.alerts[+n];break;
    case'timing':S.timing=n;break;
    case'skip':S.notify=false;S.page='home';break;
    case'mark':if(+v[0]<=0)record(+v[0])[+v[1]]=!record(+v[0])[+v[1]];break;
    case'current':let [i]=current();if(i>=0)record(0)[i]=true;break;
    case'date':S.day+=+n;break;
    case'period':S.period=n;break;
    case'detail':S.detail=+n;S.page='detail';break;
    case'detailStep':S.detail=Math.max(-330,Math.min(0,S.detail+ +n));break;
    case'editLocation':S.from='settings';S.page='location';break;
    case'editNotifications':S.from='settings';S.page='notifications';break;
    case'reset':S.page='welcome';S.from='welcome';break;
    case'lang':S.lang=n;break;
  }
  render();
});

root.addEventListener('change',e=>{
  if(e.target.dataset.key){S[e.target.dataset.key]=e.target.value;render()}
  if(e.target.id==='testTime'){S.minute=+e.target.value;render()}
});

root.addEventListener('input',e=>{
  if(e.target.id==='citySearch'){
    S.query=e.target.value;
    let k=e.target.selectionStart;
    render();
    let t=root.querySelector('#citySearch');
    t.focus();
    t.setSelectionRange(k,k);
  }
});

render();
})();
</script>
</body>
</html>

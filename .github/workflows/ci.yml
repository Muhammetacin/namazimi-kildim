name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed lockfile
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload bootstrap lockfile
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: foundation-lockfile
          path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require lockfile tracked by Git
        run: git ls-files --error-unmatch pnpm-lock.yaml
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web

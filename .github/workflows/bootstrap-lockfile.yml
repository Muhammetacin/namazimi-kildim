name: Foundation lockfile bootstrap
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'epic/01-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epic/01-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit missing lockfile
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            exit 0
          fi
          pnpm install --lockfile-only --no-frozen-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: commit generated pnpm lockfile'
          git push origin HEAD:refs/heads/epic/01-foundation
